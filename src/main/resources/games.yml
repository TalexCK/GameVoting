# Game Voting Configuration
# Define games that players can vote for
# 每个游戏都需要配置传送策略：
# wait-for-bridge-ready: true  -> 等待 CloudNet Bridge 就绪后传送
# wait-for-bridge-ready: false -> 按 expected-startup-seconds 延迟后传送

games:
  - id: "bedwars"
    name: "&e&lBedWars"
    description:
      - "&7Classic bed defense game"
      - "&7Protect your bed and destroy enemy beds"
    material: "RED_BED"
    custom-model-data: 0
    cloudnet-task: "BedWars"
    version: "1.20.1"
    wait-for-bridge-ready: true
    expected-startup-seconds: 120

  - id: "skywars"
    name: "&b&lSkyWars"
    description:
      - "&7Battle on floating islands"
      - "&7Last player standing wins"
    material: "GRASS_BLOCK"
    custom-model-data: 0
    cloudnet-task: "SkyWars"
    version: "1.20.1"
    wait-for-bridge-ready: true
    expected-startup-seconds: 120
